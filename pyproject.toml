[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rust-dll-mcp"
version = "0.1.0"
description = "MCP server exposing Rust game server DLLs as a searchable knowledge base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"mcp>=1.0.0",
	"httpx>=0.27.0",
	"platformdirs>=4.0.0",
]

[project.scripts]
rust-dll-mcp = "rust_dll_mcp.__main__:main"

[dependency-groups]
dev = [
	"pytest>=8.0.0",
	"pytest-asyncio>=0.23.0",
	"respx>=0.21.0",
]

[tool.hatch.build.targets.sdist]
exclude = [
	"/.venv",
	"/venv",
	"/.pytest_cache",
	"/dist",
	"/pipeline",
	"/.claude",
	"/.github",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
